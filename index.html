<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>1駅運転シミュレーター</title>
<style>
  :root { --panel: rgba(14,18,26,.78); --line: rgba(255,255,255,.14); --fg: #eef2f7; --muted: #9aa6b6; --pow: #4aa8ff; --brk: #ffa53a; --eb: #ff4646; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e13; color: var(--fg);
    font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #cabframe { position: fixed; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 10px #15181d, inset 0 0 80px rgba(0,0,0,.55);
    background: linear-gradient(#15181d 0 3.5%, transparent 3.5%); }
  #hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 22px 16px 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; backdrop-filter: blur(4px); }
  .lbl { font-size: 11px; color: var(--muted); letter-spacing: .08em; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  #topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  #clock { font: 700 26px/1.1 ui-monospace, "Consolas", monospace; }
  #delay.late { color: #ff8a7a; } #delay.early { color: #8fd3ff; }
  #banner { flex: 1; text-align: center; font-size: clamp(16px, 3vw, 26px); font-weight: 700; text-shadow: 0 2px 8px #000, 0 0 2px #000; opacity: 0; transition: opacity .3s; padding-top: 6px; }
  #banner.show { opacity: 1; }
  #limitPanel { text-align: center; min-width: 96px; }
  .limitSign { margin: 4px auto 0; width: 54px; height: 54px; border-radius: 50%; background: #fff; color: #111; border: 5px solid #e8502a;
    display: grid; place-items: center; font: 800 22px/1 system-ui, sans-serif; }
  #limitPanel.over .limitSign { animation: blink .4s steps(2) infinite; }
  @keyframes blink { 50% { background: #ff4646; color: #fff; } }
  #dash { display: flex; justify-content: center; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  #distPanel { min-width: 170px; }
  #dist { font: 700 30px/1.1 ui-monospace, "Consolas", monospace; }
  #dist.near { color: #ffe066; }
  #meter { width: 230px; height: 230px; }
  #notches { display: flex; flex-direction: column; gap: 2px; font: 700 12px/1 ui-monospace, "Consolas", monospace; }
  #notches div { padding: 2px 10px; border-radius: 4px; color: #56606e; text-align: center; }
  #notches div.on.p { background: var(--pow); color: #fff; }
  #notches div.on.n { background: #e8edf3; color: #111; }
  #notches div.on.b { background: var(--brk); color: #111; }
  #notches div.on.e { background: var(--eb); color: #fff; }
  #touch { position: fixed; right: 16px; bottom: 16px; display: none; flex-direction: column; gap: 8px; pointer-events: auto; }
  #touch button { width: 76px; height: 64px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font-size: 22px; font-weight: 700; touch-action: manipulation; }
  #touch button small { display: block; font-size: 10px; color: var(--muted); }
  #touch button[data-k="eb"] { background: #7a1616; height: 44px; font-size: 16px; }
  @media (pointer: coarse) { #touch { display: flex; } #dash { justify-content: flex-start; } }
  @media (max-width: 640px) {
    #meter { width: 160px; height: 160px; }
    #dist { font-size: 22px; } #clock { font-size: 20px; } #distPanel { min-width: 130px; }
    #notches div { padding: 1px 6px; font-size: 10px; }
    #dash { gap: 6px; padding-right: 88px; }
  }
  #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5,8,12,.62); padding: 16px; }
  #overlay.hidden { display: none; }
  .card { width: min(520px, 100%); background: #121823; border: 1px solid var(--line); border-radius: 16px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.5); max-height: 100%; overflow: auto; }
  .card h1 { margin: 0 0 4px; font-size: 26px; }
  .card h1 small { display: block; font-size: 13px; color: var(--muted); font-weight: 400; margin-top: 4px; }
  .card p, .card li { color: #c9d2de; font-size: 14px; line-height: 1.7; }
  .card ul { padding-left: 18px; margin: 8px 0; }
  kbd { background: #222b39; border: 1px solid #3a4558; border-bottom-width: 2px; border-radius: 4px; padding: 0 6px; font-family: ui-monospace, monospace; font-size: 12px; }
  .btn { display: block; width: 100%; margin-top: 16px; padding: 14px; border: 0; border-radius: 10px; background: #2f7cf6; color: #fff; font-size: 17px; font-weight: 700; cursor: pointer; }
  .btn:hover { background: #4a8ff8; }
  .btn:disabled { background: #34404f; color: #9aa6b6; cursor: wait; }
  .route { display: flex; align-items: center; gap: 10px; margin: 14px 0; font-weight: 700; }
  .route .bar { flex: 1; height: 4px; background: linear-gradient(90deg, #4aa8ff, #ffa53a); border-radius: 2px; }
  .rank { font: 900 72px/1 system-ui, sans-serif; text-align: center; margin: 6px 0; }
  .rank.S { color: #ffd84a; } .rank.A { color: #6fe08a; } .rank.B { color: #6fc0ff; } .rank.C { color: #c9d2de; } .rank.D, .rank.F { color: #ff7a6a; }
  table.res { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.res td { padding: 6px 4px; border-bottom: 1px solid var(--line); }
  table.res td:last-child { text-align: right; font-family: ui-monospace, monospace; }
  .total { text-align: center; font-size: 20px; font-weight: 700; margin-top: 10px; }
  .pitari { text-align: center; color: #ffd84a; font-weight: 800; font-size: 20px; }
</style>

<body>
<canvas id="c"></canvas>
<div id="cabframe"></div>

<div id="hud">
  <div id="topbar">
    <div class="panel">
      <div class="lbl">現在時刻</div>
      <div id="clock">10:00:00</div>
      <div class="sub">定刻 <span id="sched"></span> 着 <span id="delay"></span></div>
    </div>
    <div id="banner"></div>
    <div class="panel" id="limitPanel">
      <div class="lbl">制限速度</div>

  <div id="dash">

<div id="touch">
  <button data-k="up">▲<small>力行側</small></button>

  <button data-k="eb">EB</button>
</div>

<div id="overlay"><div class="card" id="card"></div></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ================= ゲーム設定 =================
const STA_A = '桜ヶ丘', STA_B = 'みなと川';
const START_S = 190;        // 先頭の出発位置 [m]
const STOP_S = 2600;        // 停止位置目標 [m]
const TRAIN_LEN = 100;      // 編成長 [m]（制限解除の判定用に標識位置へ反映）
const SCHEDULED = 155;      // 定刻までの所要時間 [s]
const LINE_LIMIT = 90;      // 線区最高速度 [km/h]
const LIMITS = [{ from: 1100, to: 1650, v: 65 }]; // 曲線制限（先頭基準。to は後部通過分を含む）
const OVERRUN_FAIL = 15;    // これ以上行き過ぎたら失格 [m]
const START_CLOCK = 10 * 3600;

// ================= 線路形状（直線→右カーブ→直線） =================
const S1 = 1100, R = 700, TH = 0.5, S2 = S1 + R * TH;
const ARC_END = { x: R - R * Math.cos(TH), z: -S1 - R * Math.sin(TH) };
function trackAt(s) {
  let phi, x, z;
  if (s < S1) { phi = 0; x = 0; z = -s; }
  else if (s < S2) { phi = (s - S1) / R; x = R - R * Math.cos(phi); z = -S1 - R * Math.sin(phi); }
  else { phi = TH; const d = s - S2; x = ARC_END.x + Math.sin(TH) * d; z = ARC_END.z - Math.cos(TH) * d; }
  return { x, z, phi, rx: Math.cos(phi), rz: Math.sin(phi) }; // r = 進行方向右向き単位ベクトル
}
function at(s, lat, y) { const t = trackAt(s); return new THREE.Vector3(t.x + t.rx * lat, y, t.z + t.rz * lat); }
const limitAt = s => { for (const L of LIMITS) if (s >= L.from && s < L.to) return L.v; return LINE_LIMIT; };

// ================= Three.js 基本 =================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
const SKY = 0xb9d9f0;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 250, 2600);
const camera = new THREE.PerspectiveCamera(58, 1, 0.1, 5000);
scene.add(new THREE.HemisphereLight(0xdfefff, 0x5d6b45, 1.1));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.8); sun.position.set(300, 500, 200); scene.add(sun);

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------- 線路に沿った押し出しメッシュ ----------
function extrudeAlong(profile, s0, s1, step, mat) {
  const n = Math.ceil((s1 - s0) / step) + 1, m = profile.length;
  const pos = new Float32Array(n * m * 3), idx = [];
  for (let i = 0; i < n; i++) {
    const t = trackAt(Math.min(s0 + i * step, s1));
    for (let j = 0; j < m; j++) {
      const [l, y] = profile[j], k = (i * m + j) * 3;
      pos[k] = t.x + t.rx * l; pos[k + 1] = y; pos[k + 2] = t.z + t.rz * l;
    }
  }
  for (let i = 0; i < n - 1; i++) for (let j = 0; j < m - 1; j++) {
    const a = i * m + j, b = a + 1, c = a + m, d = c + 1; idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, mat); scene.add(mesh); return mesh;
}

const TS0 = -400, TS1 = 3200;
const matBallast = new THREE.MeshLambertMaterial({ color: 0x8a8378, side: THREE.DoubleSide });
const matRail = new THREE.MeshStandardMaterial({ color: 0xb8bcc2, metalness: .8, roughness: .35, side: THREE.DoubleSide });
const matSleeper = new THREE.MeshLambertMaterial({ color: 0x6b6259 });
const GAUGE = 0.535;
for (const c of [0, 4]) {
  extrudeAlong([[c - 2.3, 0.0], [c - 1.4, 0.22], [c + 1.4, 0.22], [c + 2.3, 0.0]], TS0, TS1, 4, matBallast);
  for (const r of [c - GAUGE, c + GAUGE])
    extrudeAlong([[r - .035, .24], [r - .035, .38], [r + .035, .38], [r + .035, .24]], TS0, TS1, 3, matRail);
}
// 枕木
{
  const geo = new THREE.BoxGeometry(2.0, 0.14, 0.22), sp = 0.65;
  const cnt = Math.floor((TS1 - TS0) / sp) * 2;
  const inst = new THREE.InstancedMesh(geo, matSleeper, cnt);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), one = new THREE.Vector3(1, 1, 1);
  let i = 0;
  for (let s = TS0; s < TS1 && i < cnt - 1; s += sp) for (const c of [0, 4]) {
    const t = trackAt(s); q.setFromEuler(e.set(0, -t.phi, 0));
    inst.setMatrixAt(i++, m4.compose(at(s, c, .27), q, one));
  }
  inst.count = i; scene.add(inst);
}
// 地面
{
  const g = new THREE.Mesh(new THREE.PlaneGeometry(9000, 9000), new THREE.MeshLambertMaterial({ color: 0x7fa05a }));
  g.rotation.x = -Math.PI / 2; g.position.set(400, -0.02, -1500); scene.add(g);
}
// 架線柱・架線
{
  const poleGeo = new THREE.CylinderGeometry(.13, .16, 7.2, 8); poleGeo.translate(0, 3.6, 0);
  const armGeo = new THREE.BoxGeometry(7.6, .14, .14);
  const mat = new THREE.MeshLambertMaterial({ color: 0x9aa0a6 });
  const list = []; for (let s = TS0; s < TS1; s += 50) list.push(s);
  const poles = new THREE.InstancedMesh(poleGeo, mat, list.length), arms = new THREE.InstancedMesh(armGeo, mat, list.length);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), one = new THREE.Vector3(1, 1, 1);
  list.forEach((s, i) => {
    const t = trackAt(s); q.setFromEuler(e.set(0, -t.phi, 0));
    poles.setMatrixAt(i, m4.compose(at(s, 6.7, 0), q, one));
    arms.setMatrixAt(i, m4.compose(at(s, 3.0, 6.6), q, one));
  });
  scene.add(poles, arms);
  const wm = new THREE.LineBasicMaterial({ color: 0x2b2b2b });
  for (const c of [0, 4]) {
    const pts = []; for (let s = TS0; s <= TS1; s += 10) pts.push(at(s, c, 5.7));
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), wm));
  }
}
// 遠景の山
let seed = 12345; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
{
  const mMat = new THREE.MeshLambertMaterial({ color: 0x6e8a7a, flatShading: true });
  for (let j = 0; j < 9; j++) {
    const m = new THREE.Mesh(new THREE.ConeGeometry(260 + rnd() * 300, 140 + rnd() * 180, 6), mMat);
    const p = at(600 + j * 400, (j % 2 ? 1 : -1) * (1100 + rnd() * 500), 0);
    m.position.set(p.x, 60, p.z); scene.add(m);
  }
  // 進行方向の遠景
  for (let j = 0; j < 5; j++) {
    const m = new THREE.Mesh(new THREE.ConeGeometry(400 + rnd() * 300, 200 + rnd() * 200, 6), mMat);
    const p = at(4200 + rnd() * 600, (j - 2) * 700, 0); m.position.set(p.x, 80, p.z); scene.add(m);
  }
}

// ================= 外部3D素材（すべてCC0、実行時にCDNから読込） =================
// Kenney City Kit Suburban / Commercial: https://kenney.nl （GitHubミラー経由、SHA固定）
// Quaternius Nature pack / Buildings pack 3 / High Speed train: https://quaternius.com
const KENNEY = 'https://cdn.jsdelivr.net/gh/GeorgeQLe/assets-3d-city@988f219d48ecc23038ed28a411d2c71791be2c82/assets/kenney/';
const QUAT = 'https://cdn.jsdelivr.net/gh/trebeljahr/quaternius-showcase@e90ffea347393537703ae6f9d73e36492820f5a9/public/glb/';
const ASSETS = {
  houses: 'abcdefhjkmpqst'.split('').map(c => `${KENNEY}city-kit-suburban/Models/GLB%20format/building-type-${c}.glb`),
  city: [...'abcdefgh'.split('').map(c => `building-${c}`), ...'abcde'.split('').map(c => `building-skyscraper-${c}`)]
    .map(n => `${KENNEY}city-kit-commercial/Models/GLB%20format/${n}.glb`),
  far: 'abcdefghijklm'.split('').map(c => `${KENNEY}city-kit-commercial/Models/GLB%20format/low-detail-building-${c}.glb`),
  mid: ['2Story_Balcony_Mat', '2Story_Sign_Mat', '2Story_Wide_Mat', '3Story_Balcony_Mat', '3Story_Small_Mat', '3Story_Slim_Mat', '4Story_Center_Mat', '4Story_Mat', '6Story_Stack_Mat']
    .map(n => `${QUAT}buildings_pack_3/${n}.glb`),
  trees: ['CommonTree_1', 'CommonTree_2', 'CommonTree_3', 'CommonTree_4', 'CommonTree_5', 'PineTree_1', 'PineTree_2', 'PineTree_3'].map(n => `${QUAT}nature_pack/${n}.glb`),
  bushes: ['Bush_1', 'Bush_2'].map(n => `${QUAT}nature_pack/${n}.glb`),
  trainHead: ['https://static.poly.pizza/18e950a2-e71a-4479-8865-31de94e5b3d0.glb'],
  trainCar: ['https://static.poly.pizza/a413c84d-91df-4ad2-8848-2c627814b59f.glb'],
};
// 1単位あたりの実寸 [m]（素材キットごとの縮尺合わせ）
const KIT_SCALE = { houses: 8, city: 9, far: 9, mid: 2.6, trees: 3.4, bushes: 2.2 };

const gltfLoader = new GLTFLoader();
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);

// glTF を「ワールド行列を焼き込んだ部品（geometry+material）」の配列へ変換。原点=底面中心
function prepareModel(root) {
  root.updateMatrixWorld(true);
  const parts = [], box = new THREE.Box3();
  root.traverse(o => {
    if (!o.isMesh) return;
    const geo = o.geometry.clone().applyMatrix4(o.matrixWorld);
    geo.computeBoundingBox(); box.union(geo.boundingBox);
    const mats = (Array.isArray(o.material) ? o.material : [o.material]).map(m => {
      m = m.clone(); if ('metalness' in m) m.metalness = Math.min(m.metalness, .1);
      if (m.map) m.map.anisotropy = 4; return m;
    });
    parts.push({ geo, mat: Array.isArray(o.material) ? mats : mats[0] });
  });
  const c = box.getCenter(new THREE.Vector3());
  for (const p of parts) p.geo.translate(-c.x, -box.min.y, -c.z);
  return { parts, size: box.getSize(new THREE.Vector3()) };
}

async function loadGroup(urls, onDone) {
  const res = await Promise.allSettled(urls.map(u => withTimeout(gltfLoader.loadAsync(u), 20000).finally(onDone)));
  return res.filter(r => r.status === 'fulfilled').map(r => r.value);
}

// 簡易フォールバック（素材が取れなかった場合）
function fallbackBox(color) {
  const geo = new THREE.BoxGeometry(1, 1, 1); geo.translate(0, .5, 0);
  return { parts: [{ geo, mat: new THREE.MeshLambertMaterial({ color }) }], size: new THREE.Vector3(1, 1, 1) };
}
function fallbackTree() {
  const geo = new THREE.ConeGeometry(.6, 2, 7); geo.translate(0, 1, 0);
  return { parts: [{ geo, mat: new THREE.MeshLambertMaterial({ color: 0x3f6b35 }) }], size: new THREE.Vector3(1.2, 2, 1.2) };
}

// 同じモデルの配置一覧を InstancedMesh 化（部品ごとに1ドローコール）
function instanceModel(model, list) {
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), sc = new THREE.Vector3();
  for (const part of model.parts) {
    const im = new THREE.InstancedMesh(part.geo, part.mat, list.length);
    list.forEach((it, i) => im.setMatrixAt(i, m4.compose(it.p, q.setFromEuler(e.set(0, it.yaw, 0)), sc.setScalar(it.k))));
    im.computeBoundingSphere(); scene.add(im);
  }
}

// 沿線に配置。各カテゴリはモデル配列からランダムに選ぶ
function placeScenery(M) {
  const buckets = new Map();
  const put = (model, s, lat, yaw, k) => {
    if (!buckets.has(model)) buckets.set(model, []);
    buckets.get(model).push({ p: at(s, lat, 0), yaw: -trackAt(s).phi + yaw, k });
  };
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const edge = side => side < 0 ? 9 : 10; // 左: ホーム・標識、右: 対向線・架線柱の外側
  const isCity = s => s < 480 || s > 2150;
  const facing = side => (side < 0 ? Math.PI / 2 : -Math.PI / 2) + (rnd() < .3 ? Math.PI : 0);

  for (const side of [-1, 1]) {
    // 1列目: 住宅（駅周辺は商業ビル）
    for (let s = TS0; s < TS1;) {
      const city = isCity(s), cat = city ? 'city' : 'houses';
      const model = pick(M[cat]), k = KIT_SCALE[cat] * (city ? 1 : .9 + rnd() * .2);
      const half = Math.max(model.size.x, model.size.z) * k / 2;
      put(model, s, side * (edge(side) + 3 + half + rnd() * 5), facing(side), k);
      s += half * 2 + 2 + rnd() * (city ? 4 : 8);
    }
    // 2列目: 中層住宅・店舗
    for (let s = TS0; s < TS1;) {
      const model = pick(M.mid), k = KIT_SCALE.mid;
      const half = Math.max(model.size.x, model.size.z) * k / 2;
      put(model, s, side * (42 + half + rnd() * 15), facing(side), k);
      s += half * 2 + 4 + rnd() * 18;
    }
    // 遠景: 簡易ビル群
    for (let s = TS0; s < TS1 + 400;) {
      put(pick(M.far), s, side * (95 + rnd() * 120), rnd() * 6, KIT_SCALE.far * (1 + rnd() * .5));
      s += 12 + rnd() * 25;
    }
    // 線路際の木・植え込み
    for (let s = TS0; s < TS1; s += 4 + rnd() * 14) {
      if (rnd() < .45) continue;
      const big = rnd() < .55;
      const model = pick(big ? M.trees : M.bushes), k = (big ? KIT_SCALE.trees : KIT_SCALE.bushes) * (.75 + rnd() * .5);

// 長手方向をZ（前 = -Z）にそろえ、車長に合わせて縮尺。先頭車は屋根付近の頂点重心から鼻の向きを推定
function prepareTrainCar(gltf, isHead) {
  const m = prepareModel(gltf.scene);
  const alongX = m.size.x >= m.size.z, L = alongX ? m.size.x : m.size.z;
  const k = ONCOMING.carLen / L;
  let rot = alongX ? Math.PI / 2 : 0; // +X → -Z
  if (isHead) {
    let sum = 0, n = 0;
    for (const p of m.parts) {
      const pos = p.geo.attributes.position;
      for (let i = 0; i < pos.count; i++) if (pos.getY(i) > m.size.y * .8) { sum += alongX ? pos.getX(i) : -pos.getZ(i); n++; }
    }
    if (n && sum / n > 0) rot += Math.PI; // 鼻は重心と逆側
  }
  const mat = new THREE.Matrix4().makeScale(k * .85, k, k) // 狭軌の通勤車らしく車幅を詰める
   .multiply(new THREE.Matrix4().makeRotationY(rot));
  const recolor = { white: [0xc9ced4, .55, .35], blue: [0x2f9a52, .1, .5] }; // 銀の車体＋緑帯（通勤電車風）
  for (const p of m.parts) {
    p.geo.applyMatrix4(mat);
    for (const mm of [].concat(p.mat)) {
      const c = recolor[(mm.name || '').toLowerCase()];
      if (c && mm.color) { mm.color.setHex(c[0]); if ('metalness' in mm) { mm.metalness = c[1]; mm.roughness = c[2]; } }
    }
  }
  return m;
}

  const g = new THREE.Group(), L = ONCOMING.carLen;

  body.position.y = 2.2; g.add(body);

  stripe.position.y = 1.55; g.add(stripe);

function buildOncoming(head, car) {

    let obj;

function updateOncoming(dt, playerS) {
  const O = ONCOMING;
  if (!oncoming.active && !oncoming.done && playerS >= O.spawnAt) { oncoming.active = true; oncoming.head = O.startS; oncoming.group.visible = true; }
  if (!oncoming.active) return;

  oncoming.cars.forEach((c, i) => {
    const s = oncoming.head + O.carLen / 2 + i * (O.carLen + O.gap);
    c.position.copy(at(s, O.lat, .38));

  });

  const d = oncoming.head - playerS;

  const dist = d > 0 ? d : tail > playerS ? 0 : playerS - tail;

}

async function loadAllAssets(progress) {
  const total = Object.values(ASSETS).reduce((a, b) => a + b.length, 0);
  let done = 0; const tick = () => progress(++done, total);
  const loaded = Object.fromEntries(await Promise.all(Object.entries(ASSETS).map(async ([k, urls]) => [k, await loadGroup(urls, tick)])));
  const M = {};
  for (const k of ['houses', 'city', 'far', 'mid', 'trees', 'bushes']) M[k] = loaded[k].map(g => prepareModel(g.scene));
  if (!M.houses.length) M.houses = [fallbackBox(0xe0d4c0)];
  if (!M.city.length) M.city = [fallbackBox(0xb9c1c9)];
  if (!M.far.length) M.far = [fallbackBox(0x9fa8b3)];
  if (!M.mid.length) M.mid = M.houses;
  if (!M.trees.length) M.trees = [fallbackTree()];
  if (!M.bushes.length) M.bushes = M.trees;
  placeScenery(M);
  buildOncoming(loaded.trainHead[0] && prepareTrainCar(loaded.trainHead[0], true), loaded.trainCar[0] && prepareTrainCar(loaded.trainCar[0], false));
  const failed = total - Object.values(loaded).reduce((a, b) => a + b.length, 0);

const sfx = (() => {
  let ac, master, motor, motorGain, rollGain, passGain, noiseBuf;
  function init() {
    if (ac) return; ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .55; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    motor = ac.createOscillator(); motor.type = 'sawtooth';
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800;
    motorGain = ac.createGain(); motorGain.gain.value = 0;
    motor.connect(lp).connect(motorGain).connect(master); motor.start();
    const roll = ac.createBufferSource(); roll.buffer = noiseBuf; roll.loop = true;
    const rf = ac.createBiquadFilter(); rf.type = 'lowpass'; rf.frequency.value = 350;
    rollGain = ac.createGain(); rollGain.gain.value = 0;
    roll.connect(rf).connect(rollGain).connect(master); roll.start();
    const wind = ac.createBufferSource(); wind.buffer = noiseBuf; wind.loop = true;
    const wf = ac.createBiquadFilter(); wf.type = 'bandpass'; wf.frequency.value = 700; wf.Q.value = .5;
    passGain = ac.createGain(); passGain.gain.value = 0;
    wind.connect(wf).connect(passGain).connect(master); wind.start();
  }
  function tone(f, dur, vol = .15, type = 'sine', when = 0) {
    if (!ac) return; const t0 = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(master); o.start(t0); o.stop(t0 + dur + .02);
  }
  function joint(when, vol) {
    if (!ac) return; const t0 = ac.currentTime + when, src = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf; bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = .8;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + .09);
    src.connect(bp).connect(g).connect(master); src.start(t0, Math.random()); src.stop(t0 + .12);
  }
  return {
    init,
    click: () => tone(1400, .04, .08, 'square'),
    beep: () => tone(1050, .18, .1, 'square'),
    horn: () => { for (const f of [370, 466]) tone(f, 1.3, .07, 'sawtooth'); },
    pass: x => { if (ac) passGain.gain.setTargetAtTime(x * .4, ac.currentTime, .08); },
    chime: () => { tone(988, .6, .18); tone(784, .9, .18, 'sine', .35); },
    joint: v => { const vol = Math.min(.5, v / 20 * .5); joint(0, vol); joint(Math.min(.25, 2.1 / v), vol * .8); },
    update(v, notch) {
      if (!ac) return; const now = ac.currentTime, vk = v * 3.6;
      let g = 0; const f = 90 + vk * 11;
      if (v > .05 && notch > 0) g = .02 + .03 * notch / 5;
      else if (v > 1.5 && notch < 0 && notch > -9) g = .018;
      motor.frequency.setTargetAtTime(f, now, .05); motorGain.gain.setTargetAtTime(g, now, .1);
      rollGain.gain.setTargetAtTime(Math.min(.22, v / 25 * .22), now, .2);
    },
    mute() { if (ac) { motorGain.gain.setTargetAtTime(0, ac.currentTime, .1); rollGain.gain.setTargetAtTime(0, ac.currentTime, .3); passGain.gain.setTargetAtTime(0, ac.currentTime, .3); } },
  };
})();

  const err = G.s - STOP_S, delay = G.t - SCHEDULED;
  let stopPts = 0, timePts = 0, safePts = 0, rank = 'F', note = '';
  const jolt = G.notchAtStop <= -5;
  if (kind === 'overrun') {
    note = '<div class="pitari" style="color:#ff7a6a">オーバーラン！</div>';
  } else {
    stopPts = Math.max(0, 50 - Math.max(0, Math.abs(err) - .3) * 8);
    timePts = Math.max(0, 30 - Math.max(0, Math.abs(delay) - 1) * 1.5);
    safePts = Math.max(0, 20 - G.overspeed * 2 - (G.eb ? 10 : 0) - (jolt ? 5 : 0));
    const tot = stopPts + timePts + safePts;
    rank = tot >= 95 ? 'S' : tot >= 85 ? 'A' : tot >= 70 ? 'B' : tot >= 50 ? 'C' : 'D';
    if (Math.abs(err) <= .3) note = '<div class="pitari">停止位置ピッタリ！</div>';
    else if (err < -15) note = '<div class="pitari" style="color:#ffb02e">停止位置まで届かず…</div>';
  }
  sfx.chime();
  const total = Math.round(stopPts + timePts + safePts);
  const errTxt = `${err >= 0 ? '+' : ''}${err.toFixed(2)} m（${err >= 0 ? '行き過ぎ' : '手前'}）`;
  const dTxt = `${delay >= 0 ? '+' : ''}${delay.toFixed(1)} 秒`;
  $('overlay').classList.remove('hidden');
  $('card').innerHTML = `
    <h1>${kind === 'overrun' ? '失格' : `${STA_B} 到着`}<small>${STA_A} → ${STA_B}</small></h1>
    <div class="rank ${rank}">${rank}</div>${note}
    <table class="res">
      <tr><td>停止位置誤差</td><td>${errTxt}</td></tr>
      <tr><td>到着時刻（定刻比）</td><td>${fmtClock(START_CLOCK + G.t)}（${dTxt}）</td></tr>
      <tr><td>速度超過時間</td><td>${G.overspeed.toFixed(1)} 秒</td></tr>
      <tr><td>非常ブレーキ使用</td><td>${G.eb ? 'あり' : 'なし'}</td></tr>
      <tr><td>停車時の衝動</td><td>${jolt ? `あり（${notchName(G.notchAtStop)}で停車）` : 'なし'}</td></tr>
      <tr><td>停止 / 定時 / 安全</td><td>${Math.round(stopPts)}/50 · ${Math.round(timePts)}/30 · ${Math.round(safePts)}/20</td></tr>
    </table>
    <div class="total">${total} 点</div>
    <button class="btn" id="go">もう一度（Enter）</button>`;
  $('go').onclick = startOrRetry;
}

// ================= ループ =================
const clock = new THREE.Clock();
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
function step(dt) {
  const v = G.v, n = G.notch;
  let target = 0;
  if (n > 0) { const amax = v < 9.7 ? .92 : .92 * 9.7 / v; target = amax * n / 5; }
  else if (n < 0) target = n === -9 ? -1.45 : -1.15 * (-n) / 8;
  const tau = n < 0 ? .75 : .5; // 空気ブレーキの立ち上がり遅れ
  G.acc += (target - G.acc) * Math.min(1, dt / tau);
  const res = .018 + .00005 * v * v;
  const a = G.acc - (v > 0 ? res : 0);
  const prevV = G.v;
  G.v = Math.max(0, v + a * dt);
  if (prevV > 0 && G.v === 0) G.notchAtStop = n;
  G.s += G.v * dt; G.t += dt;

  const vk = G.v * 3.6, lim = limitAt(G.s);
  if (vk > lim + .5) {
    G.overspeed += dt; G.beepT -= dt;
    if (G.beepT <= 0) { sfx.beep(); G.beepT = .5; }
    if (!G.flags.ovs) { banner('速度超過！ 減速せよ', 2); G.flags.ovs = true; }
  } else G.flags.ovs = false;
  if (n === -9 && G.v > 0) G.eb = true;

  const j = Math.floor(G.s / 25);
  if (j !== G.lastJoint) { G.lastJoint = j; if (G.v > 1) sfx.joint(G.v); }
  sfx.update(G.v, n);
  updateOncoming(dt, G.s);

  const f = G.flags;
  for (const L of LIMITS) {
    if (!f['pre' + L.from] && L.from - G.s < 600) { f['pre' + L.from] = 1; banner(`この先 曲線制限 ${L.v}km/h`, 3); }
    if (!f['end' + L.from] && G.s >= L.to) { f['end' + L.from] = 1; banner('制限解除', 2); }
  }
  if (!f.ann && STOP_S - G.s < 800) { f.ann = 1; banner(`次は ${STA_B}、${STA_B}です`, 3.5); sfx.chime(); }
  if (!f.near && STOP_S - G.s < 100) { f.near = 1; banner('停止位置まで 100m', 2); }

  if (G.s > STOP_S + OVERRUN_FAIL) { finish('overrun'); return; }
  if (G.v === 0 && G.s > STOP_S - 40) {
    G.stopTimer += dt;
    if (G.stopTimer > 1.0) finish('stop');
  } else G.stopTimer = 0;
}

function updateHud() {
  const vk = G.v * 3.6, lim = limitAt(G.s), now = START_CLOCK + G.t;
  $('clock').textContent = fmtClock(now);
  const remain = SCHEDULED - G.t;
  const del = $('delay');
  if (G.state === 'run' && remain < 0) { del.textContent = `(遅れ ${Math.floor(-remain)}秒)`; del.className = 'late'; }
  else { del.textContent = G.state === 'run' ? `(あと ${Math.ceil(remain)}秒)` : ''; del.className = 'early'; }
  $('limit').textContent = lim;
  $('limitPanel').classList.toggle('over', vk > lim + .5);
  let nxt = '&nbsp;';
  for (const L of LIMITS) if (L.from > G.s && L.from - G.s < 900) nxt = `${L.v} まで ${Math.round(L.from - G.s)}m`;
  $('nextLimit').innerHTML = nxt;
  const d = STOP_S - G.s, el = $('dist');
  el.textContent = d > 100 ? `${Math.round(d)} m` : d >= 0 ? `${d.toFixed(2)} m` : `+${(-d).toFixed(2)} m`;
  el.classList.toggle('near', d <= 100);
  drawMeter(vk, lim);
}

function updateCamera(time) {
  const lat = -.45, s = G.s;
  const shake = Math.min(1, G.v / 22);
  camPos.copy(at(s, lat, 3.0));
  camPos.y += Math.sin(time * 11.3) * .006 * shake + Math.sin(time * 3.1) * .012 * shake;
  camLook.copy(at(s + 60, lat * .3, 2.4));
  camLook.x += Math.sin(time * 2.3) * .06 * shake;
  camera.position.copy(camPos); camera.lookAt(camLook);
}

function loop() {
  const dt = Math.min(.05, clock.getDelta()), time = clock.elapsedTime;
  if (G.state === 'run') step(dt);
  if (bannerTimer > 0 && (bannerTimer -= dt) <= 0) $('banner').classList.remove('show');
  updateHud(); updateCamera(time);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
let assetsReady = false;
showTitle();
loadAllAssets((d, n) => { const b = $('go'); if (b && !assetsReady) b.textContent = `3D素材を読み込み中… ${d}/${n}`; })
  .catch(e => console.error(e))
  .finally(() => { assetsReady = true; if (G.state === 'title') showTitle(); });
loop();
</script>
